# Production: use docker-compose.prod.yml override (no exposed ports, TLS, secrets)
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-raivan_global}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.next
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env.docker
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-raivan_global}?schema=public'
      AI_SERVICE_URL: 'http://fastapi:8000'
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started

  fastapi:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file: .env.docker
    environment:
      DATABASE_URL: 'postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-raivan_global}'
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      CORS_ORIGINS: 'http://nextjs:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
