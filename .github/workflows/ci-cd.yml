name: Gold-Standard CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # FRONTEND (Next.js) — Lint, Type-Check, Test, Build
  # ============================================================================
  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://localhost/dummy"

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
        continue-on-error: false

      - name: TypeScript type-check
        run: npm run type-check
        continue-on-error: false

      - name: Build verification
        run: npm run build
        continue-on-error: false

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://localhost/dummy"

      - name: Run Jest tests
        run: npm test -- --coverage --passWithNoTests
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://localhost/dummy"

      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Security-Crawler-Frontend'
          path: '.'
          format: 'JSON'
          args: >
            --enableExperimental
            --enablePyPkg
        continue-on-error: true

  # ============================================================================
  # BACKEND (FastAPI) — Lint, Type-Check, Test
  # ============================================================================
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit[toml]

      - name: Ruff lint check
        run: |
          cd ai-service
          ruff check .
        continue-on-error: false

      - name: Ruff format check
        run: |
          cd ai-service
          ruff format --check .
        continue-on-error: false

      - name: Bandit security scan
        run: |
          cd ai-service
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raivan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run pytest
        run: |
          cd ai-service
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term -m "not integration"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test
          ALLOW_INSECURE_LOCAL: "true"
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./ai-service/coverage.xml
          flags: backend
          name: backend-coverage

  # ============================================================================
  # DOCKER BUILD & SCAN
  # ============================================================================
  docker-build:
    name: Docker Image Build & Scan
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality]
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.frontend
            image-name: security-crawler-frontend
            context: .

          - dockerfile: Dockerfile.backend
            image-name: security-crawler-backend
            context: ./ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================================================
  # DATABASE MIGRATIONS TEST
  # ============================================================================
  migrations-test:
    name: Database Migrations Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raivan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/raivan_test"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test

      - name: Verify schema
        run: npx prisma db pull --print
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test
        continue-on-error: true

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, migrations-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raivan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/raivan_test"

      - name: Install Python dependencies
        run: |
          cd ai-service
          python -m pip install -r requirements.txt

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test

      - name: Start FastAPI backend
        run: |
          cd ai-service
          uvicorn main:app --port 8000 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test

      - name: Start Next.js frontend
        run: npm run dev &

      - name: Wait for services
        run: sleep 10

      - name: Run integration tests
        run: npm run test:e2e || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raivan_test

  # ============================================================================
  # SECURITY CHECKS (OWASP, Secrets Scanning)
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
        continue-on-error: true

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # CODE QUALITY SUMMARY
  # ============================================================================
  quality-summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs:
      [
        frontend-quality,
        frontend-tests,
        frontend-security,
        backend-quality,
        backend-tests,
        docker-build,
        migrations-test,
        security,
      ]
    if: always()

    steps:
      - name: Check Quality Gates
        run: |
          echo "✅ Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "✅ Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "✅ Frontend Security: ${{ needs.frontend-security.result }}"
          echo "✅ Backend Quality: ${{ needs.backend-quality.result }}"
          echo "✅ Backend Tests: ${{ needs.backend-tests.result }}"
          echo "✅ Docker Build: ${{ needs.docker-build.result }}"
          echo "✅ Migrations Test: ${{ needs.migrations-test.result }}"
          echo "✅ Security Scan: ${{ needs.security.result }}"

      - name: Fail if critical checks failed
        if: |
          needs.frontend-quality.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.backend-quality.result == 'failure' ||
          needs.backend-tests.result == 'failure'
        run: exit 1

  # ============================================================================
  # DEPLOYMENT (Main branch only)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-summary, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.raivanglobal.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Example: ./scripts/deploy-staging.sh

      - name: Smoke test staging
        run: |
          curl -f https://staging.raivanglobal.com/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-summary, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://raivanglobal.com
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment script here
          # Example: ./scripts/deploy-production.sh

      - name: Smoke test production
        run: |
          curl -f https://raivanglobal.com/health || exit 1
