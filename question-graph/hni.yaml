# HNI Question Graph — SSOT
# Raivan Global: Physical Security Audit for High Net Worth Individuals
# Version: 2
# DO NOT edit the database directly. Edit this file and re-run seed script.

metadata:
  track: hni
  version: 2
  entry_node: hni_q1_property_type

nodes:
  # ===== OPENING =====
  - id: hni_q1_property_type
    domain: CPP-07
    text: 'What type of property are we auditing today?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: [Villa, Apartment, Farmhouse, Penthouse, 'Multiple properties', Home Office]
    edges:
      - target: hni_q1_multi_governance
        condition: 'Multiple properties'
      - target: hni_q2_existing_vendor
        condition: any

  - id: hni_q1_multi_governance
    domain: CPP-07
    text: 'For multiple properties, is there a single person or team responsible for security across all locations?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options:
      [
        'Yes — dedicated security manager',
        'Partially — different staff per property',
        'No — ad hoc',
      ]
    edges:
      - target: hni_q1_multi_consistency
        condition: any

  - id: hni_q1_multi_consistency
    domain: CPP-07
    text: 'Are security policies consistent across all your properties, or does each have its own approach?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Consistent policies', 'Varies by property', 'No formal policies anywhere']
    edges:
      - target: hni_q2_existing_vendor
        condition: any

  - id: hni_q2_existing_vendor
    domain: CPP-07
    text: 'Do you currently work with a security agency or consultant?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Yes', 'No']
    edges:
      - target: hni_q3_incident_history
        condition: any

  - id: hni_q3_incident_history
    domain: CPP-04
    text: 'Has your property experienced any security incident or near-miss in the past 12 months?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes', 'No', 'Prefer not to say']
    edges:
      - target: hni_cpp01_perimeter
        condition: any

  # ===== CPP-01: Physical Security =====
  - id: hni_cpp01_perimeter
    domain: CPP-01
    text: 'What type of perimeter protection does your property have?'
    question_type: multi_choice
    cpp_domain_tag: CPP-01
    options: [Boundary wall, Fence, Hedgerow, None, Other]
    edges:
      - target: hni_cpp01_cctv
        condition: any

  - id: hni_cpp01_cctv
    domain: CPP-01
    text: 'Do you have CCTV cameras installed? If yes, are there any known blind spots?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options:
      ['Yes — full coverage', 'Yes — some blind spots', 'Yes — unsure about coverage', 'No CCTV']
    edges:
      - target: hni_cpp01_gate_code
        condition: any

  - id: hni_cpp01_gate_code
    domain: CPP-01
    text: 'Is your gate access code shared with delivery personnel or vendors?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    score_drop_trigger: true
    options: ['Yes', 'No', 'No gate code system']
    edges:
      - target: hni_cpp01_lighting
        condition: any

  - id: hni_cpp01_lighting
    domain: CPP-01
    text: 'Is the perimeter of your property adequately lit at night?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Fully lit', 'Partially lit', 'Not lit', 'Unsure']
    edges:
      - target: hni_cpp01_access_control
        condition: any

  - id: hni_cpp01_access_control
    domain: CPP-01
    related_domains: [CPP-06]
    text: 'What access control measures protect entry to your home (main doors, service entries)?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    score_drop_trigger: true
    options:
      [
        'Biometric/smart lock',
        'Keycard or digital code',
        'Traditional lock only',
        'No formal access control',
      ]
    edges:
      - target: hni_cpp01_visitor_screening
        condition: 'Traditional lock only'
      - target: hni_cpp01_visitor_screening
        condition: 'No formal access control'
      - target: hni_cpp06_staff_count
        condition: any

  # --- CPP-01 Deep-Dive: Access Control (triggered by negative answers) ---
  - id: hni_cpp01_visitor_screening
    domain: CPP-01
    related_domains: [CPP-06]
    text: 'Do you have any process to verify the identity of visitors before they enter the property?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options:
      ['Yes — intercom/camera at gate', 'Ask guards to check', 'No — direct entry', 'Open compound']
    edges:
      - target: hni_cpp01_contractor_policy
        condition: any

  - id: hni_cpp01_contractor_policy
    domain: CPP-01
    text: 'When contractors (plumbers, electricians, renovation workers) visit, are they accompanied by staff?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Always escorted', 'Sometimes', 'Never — work unsupervised', 'Depends on trust level']
    edges:
      - target: hni_cpp01_after_hours_protocol
        condition: any

  - id: hni_cpp01_after_hours_protocol
    domain: CPP-01
    text: 'Do you have a defined protocol for after-hours access (late night, early morning)?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options:
      [
        'Yes — strict protocol',
        'Informal arrangement',
        'No — same as daytime',
        'Property is always attended',
      ]
    edges:
      - target: hni_cpp06_staff_count
        condition: any

  # ===== CPP-06: Personnel Security =====
  - id: hni_cpp06_staff_count
    domain: CPP-06
    text: 'How many domestic staff do you currently employ? (guards, drivers, cooks, maids, etc.)'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options: ['0', '1-3', '4-7', '8+']
    edges:
      - target: hni_cpp06_background_checks
        condition: any

  - id: hni_cpp06_background_checks
    domain: CPP-06
    text: 'Do you conduct background checks on all domestic staff before hiring?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    score_drop_trigger: true
    options: ['Yes — verified agency', 'Informal checks only', 'No']
    edges:
      - target: hni_cpp06_vetting_frequency
        condition: 'Informal checks only'
      - target: hni_cpp06_vetting_frequency
        condition: 'No'
      - target: hni_cpp06_access_zones
        condition: any

  # --- CPP-06 Deep-Dive: Personnel Vetting (triggered by negative answers) ---
  - id: hni_cpp06_vetting_frequency
    domain: CPP-06
    text: 'How often do you re-verify or re-vet existing domestic staff?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options: ['Annually', 'Only at hiring', 'Never re-verified', 'Plan to start']
    edges:
      - target: hni_cpp06_termination_procedure
        condition: any

  - id: hni_cpp06_termination_procedure
    domain: CPP-06
    text: 'When a staff member leaves (fired or resigns), is there a formal process to recover keys/codes and revoke access?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options:
      [
        'Yes — documented procedure',
        'Informal — collect keys',
        'No formal process',
        'Never had to do this',
      ]
    edges:
      - target: hni_cpp06_access_zones
        condition: any

  - id: hni_cpp06_access_zones
    domain: CPP-06
    text: 'Do all staff members have unrestricted access to all areas of your property?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options: ['Yes — all areas', 'No — restricted zones exist', 'Unsure']
    edges:
      - target: hni_cpp05_smart_home
        condition: any

  # ===== CPP-05: Information Security =====
  - id: hni_cpp05_smart_home
    domain: CPP-05
    text: 'Do you use smart home devices (smart locks, Alexa/Google Home, smart cameras)?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — multiple devices', 'Yes — 1-2 devices', 'No']
    edges:
      - target: hni_cpp05_cctv_cloud
        condition: any

  - id: hni_cpp05_cctv_cloud
    domain: CPP-05
    text: 'Are your CCTV/security cameras connected to a cloud app with default login credentials?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    score_drop_trigger: true
    options:
      ['Yes — default settings', 'No — credentials changed', 'Not connected to cloud', 'Unsure']
    edges:
      - target: hni_cpp05_wifi
        condition: any

  - id: hni_cpp05_wifi
    domain: CPP-05
    text: 'Is your home WiFi network segregated from your security system network?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — separate networks', 'No — same network', 'Unsure']
    edges:
      - target: hni_cpp05_guest_wifi
        condition: 'No — same network'
      - target: hni_cpp05_guest_wifi
        condition: 'Unsure'
      - target: hni_cpp03_emergency_plan
        condition: any

  # --- CPP-05 Deep-Dive: Network Security (triggered by flat network) ---
  - id: hni_cpp05_guest_wifi
    domain: CPP-05
    text: 'Do guests, visitors, or staff connect their personal devices to your main WiFi?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options:
      ['Yes — same password for all', 'Yes — separate guest network', 'No — only family', 'Unsure']
    edges:
      - target: hni_cpp05_remote_access
        condition: any

  - id: hni_cpp05_remote_access
    domain: CPP-05
    text: 'Can your security system (cameras, alarms, locks) be controlled remotely via a phone app?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — app with 2FA', 'Yes — app without 2FA', 'No remote access', 'Unsure']
    edges:
      - target: hni_cpp03_emergency_plan
        condition: any

  # ===== CPP-03: Crisis Management =====
  - id: hni_cpp03_emergency_plan
    domain: CPP-03
    text: 'Does your household have a documented emergency response plan rehearsed in the last year?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    score_drop_trigger: true
    options: ['Yes — documented and rehearsed', 'Documented but not rehearsed', 'No plan exists']
    edges:
      - target: hni_cpp03_last_drill
        condition: 'Documented but not rehearsed'
      - target: hni_cpp03_last_drill
        condition: 'No plan exists'
      - target: hni_cpp03_safe_room
        condition: any

  # --- CPP-03 Deep-Dive: Emergency Preparedness ---
  - id: hni_cpp03_last_drill
    domain: CPP-03
    text: 'When was the last time any emergency drill or discussion was held with household members?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options: ['Within 6 months', '6-12 months ago', 'Over a year ago', 'Never']
    edges:
      - target: hni_cpp03_comms_tree
        condition: any

  - id: hni_cpp03_comms_tree
    domain: CPP-03
    text: 'Does your household have a defined communication tree (who calls whom) during an emergency?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options:
      [
        'Yes — documented with phone numbers',
        'Informally understood',
        'No — everyone calls 100/police',
      ]
    edges:
      - target: hni_cpp03_safe_room
        condition: any

  - id: hni_cpp03_safe_room
    domain: CPP-03
    text: 'Does your property have a designated safe room or panic button system?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options: ['Yes — both', 'Safe room only', 'Panic button only', 'Neither']
    edges:
      - target: hni_cpp03_family_training
        condition: any

  - id: hni_cpp03_family_training
    domain: CPP-03
    text: 'Are family members (including children and elderly) trained on what to do in a security emergency?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options: ['Yes — all members', 'Some members', 'No']
    edges:
      - target: hni_cpp02_risk_assessment
        condition: any

  # ===== CPP-02: Business Principles =====
  - id: hni_cpp02_risk_assessment
    domain: CPP-02
    text: 'When was the last time you conducted a formal security risk assessment of your property?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options: ['Within last year', '1-3 years ago', 'Never', 'Unsure']
    edges:
      - target: hni_cpp02_risk_owner
        condition: 'Never'
      - target: hni_cpp02_risk_owner
        condition: 'Unsure'
      - target: hni_cpp02_review_trigger
        condition: any

  # --- CPP-02 Deep-Dive: Risk Governance ---
  - id: hni_cpp02_risk_owner
    domain: CPP-02
    text: 'Is there a specific person in your household accountable for identifying and managing security risks?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options:
      ['Yes — me personally', 'Yes — security manager', 'Shared vaguely', 'No one specifically']
    edges:
      - target: hni_cpp02_last_review_date
        condition: any

  - id: hni_cpp02_last_review_date
    domain: CPP-02
    text: 'Has any security-related decision (new locks, cameras, guards) been made in the past 6 months?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options:
      ['Yes — significant investment', 'Yes — minor upgrades', 'No changes', 'Planning to invest']
    edges:
      - target: hni_cpp02_review_trigger
        condition: any

  - id: hni_cpp02_review_trigger
    domain: CPP-02
    text: 'Do you review security measures after significant life events (new staff, renovation, extended travel)?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options: ['Always', 'Sometimes', 'Never']
    edges:
      - target: hni_cpp07_accountability
        condition: any

  # ===== CPP-07: Security Management =====
  - id: hni_cpp07_accountability
    domain: CPP-07
    text: 'Who is primarily accountable for security decisions in your household?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options:
      [
        'Myself',
        'Spouse/Partner',
        'Security agency',
        'No one specifically',
        'Shared responsibility',
      ]
    edges:
      - target: hni_cpp07_review_cycle
        condition: any

  - id: hni_cpp07_review_cycle
    domain: CPP-07
    text: "Do you have a recurring schedule to review your property's security posture?"
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Yes — quarterly or more', 'Yes — annually', 'No recurring schedule']
    edges:
      - target: hni_cpp04_incident_reporting
        condition: any

  # ===== CPP-04: Investigations =====
  - id: hni_cpp04_incident_reporting
    domain: CPP-04
    text: 'Are minor security incidents (suspicious visitor, unlocked door, missing item) formally logged?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes — written log', 'Verbal reporting only', 'Not logged']
    edges:
      - target: hni_cpp04_corrective_actions
        condition: any

  - id: hni_cpp04_corrective_actions
    domain: CPP-04
    text: 'When a security incident occurs, are corrective actions taken and verified?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes — documented', 'Informal fixes', 'No follow-up']
    edges:
      - target: hni_travel_module_entry
        condition: any

  # ===== Travel / Absence Module =====
  - id: hni_travel_module_entry
    domain: CPP-01
    text: 'Do you travel away from this property for extended periods (1+ weeks)?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Yes — frequently', 'Yes — occasionally', 'Rarely/Never']
    edges:
      - target: hni_travel_key_holder
        condition: 'Yes — frequently'
      - target: hni_travel_key_holder
        condition: 'Yes — occasionally'
      - target: hni_visitor_delivery
        condition: 'Rarely/Never'

  - id: hni_travel_key_holder
    domain: CPP-06
    text: 'When you are away, who holds the keys to your property?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options:
      [
        'Trusted family member',
        'Domestic staff',
        'Security agency',
        'Neighbor',
        'No one — property empty',
      ]
    edges:
      - target: hni_visitor_delivery
        condition: any

  # ===== Visitor / Delivery Module =====
  - id: hni_visitor_delivery
    domain: CPP-01
    text: 'Can delivery personnel (food delivery, packages) enter your property gate without escort?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Yes — unrestricted', 'Yes — to designated area only', 'No — met at gate']
    edges:
      - target: hni_visitor_log
        condition: any

  - id: hni_visitor_log
    domain: CPP-04
    text: 'Do you maintain a visitor log (physical or digital) for your property?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes', 'No', 'Security agency handles it']
    edges:
      - target: hni_terminal
        condition: any

  # ===== TERMINAL =====
  - id: hni_terminal
    domain: CPP-07
    text: 'Thank you. Your security assessment is complete. We are generating your report.'
    question_type: terminal
    cpp_domain_tag: CPP-07
    is_terminal: true
    edges: []
