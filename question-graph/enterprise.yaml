# Enterprise Question Graph — SSOT
# Raivan Global: Physical Security Audit for Enterprise Facilities
# Version: 2
# Extends 7 CPP core domains with 6 enterprise-specific modules.

metadata:
  track: enterprise
  version: 2
  entry_node: ent_q1_facility_type

nodes:
  # ===== OPENING =====
  - id: ent_q1_facility_type
    domain: CPP-07
    text: 'What type of facility are we auditing?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options:
      [
        Corporate Office,
        Warehouse,
        Fulfilment Centre,
        Manufacturing Plant,
        Data Centre,
        Campus,
        Multi-site Operation,
        Retail Chain,
      ]
    edges:
      - target: ent_facility_warehouse_yard
        condition: 'Warehouse'
      - target: ent_facility_warehouse_yard
        condition: 'Fulfilment Centre'
      - target: ent_facility_warehouse_yard
        condition: 'Manufacturing Plant'
      - target: ent_facility_multisite_officers
        condition: 'Multi-site Operation'
      - target: ent_q2_existing_vendor
        condition: any

  # --- Facility-Type Module: Warehouse/Manufacturing ---
  - id: ent_facility_warehouse_yard
    domain: CPP-01
    text: 'Is the external yard/dispatch area physically separated from public access roads with controlled vehicle entry?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Yes — barrier and guard', 'Partial — barrier only', 'No — open yard']
    edges:
      - target: ent_facility_shift_worker_vetting
        condition: any

  - id: ent_facility_shift_worker_vetting
    domain: CPP-06
    text: 'Are temporary/shift workers issued unique access credentials (not shared group cards)?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    options:
      ['Yes — individual credentials', 'Shared group card', 'No access credentials', 'Biometric']
    edges:
      - target: ent_facility_dock_cctv
        condition: any

  - id: ent_facility_dock_cctv
    domain: CPP-01
    text: 'Is the loading dock covered by CCTV with tamper alerts and at least 30-day retention?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Yes — all criteria met', 'Partial — some gaps', 'No CCTV on dock', 'Unsure']
    edges:
      - target: ent_q2_existing_vendor
        condition: any

  # --- Facility-Type Module: Multi-site ---
  - id: ent_facility_multisite_officers
    domain: CPP-07
    text: 'Does each site have a designated security officer, or is one person responsible for all?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options:
      [
        'Dedicated officer per site',
        'One person covers all sites',
        'No formal appointment',
        'Regional security managers',
      ]
    edges:
      - target: ent_facility_group_audit_freq
        condition: any

  - id: ent_facility_group_audit_freq
    domain: CPP-07
    text: 'How often is a consolidated security audit conducted across all sites?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Quarterly', 'Annually', 'Ad hoc / never', 'Only at individual site level']
    edges:
      - target: ent_facility_consolidated_reporting
        condition: any

  - id: ent_facility_consolidated_reporting
    domain: CPP-07
    text: 'Is there a unified security incident reporting system across all sites?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options:
      [
        'Yes — centralised platform',
        'Each site has its own',
        'No formal system',
        'Paper-based only',
      ]
    edges:
      - target: ent_q2_existing_vendor
        condition: any

  - id: ent_q2_existing_vendor
    domain: CPP-07
    text: 'Does this facility currently have a contracted security agency?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Yes', 'No']
    edges:
      - target: ent_q3_compliance_audit
        condition: any

  - id: ent_q3_compliance_audit
    domain: CPP-07
    text: 'Has this facility undergone a formal security audit against ISO 27001 or PSARA in the last 12 months?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    score_drop_trigger: true
    options: ['Yes — ISO 27001 certified', 'Yes — PSARA compliant', 'No formal audit', 'Unsure']
    edges:
      - target: ent_iso_gap_analysis
        condition: 'Yes — ISO 27001 certified'
      - target: ent_cpp01_perimeter
        condition: any

  # --- Compliance-Track Branch ---
  - id: ent_iso_gap_analysis
    domain: CPP-05
    text: 'Since your last ISO 27001 certification, have any non-conformities been identified in physical security controls?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — all resolved', 'Yes — some outstanding', 'No non-conformities', 'Unsure']
    edges:
      - target: ent_cpp01_perimeter
        condition: any

  # ===== CPP-01: Physical Security =====
  - id: ent_cpp01_perimeter
    domain: CPP-01
    text: 'How would you describe the current state of your facility perimeter security?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options:
      - 'Fully fenced with monitored access points'
      - 'Partially fenced — some gaps exist'
      - 'Unfenced or open boundary'
      - 'No formal perimeter controls'
    edges:
      - target: ent_cpp01_cctv_sop
        condition: any

  - id: ent_cpp01_cctv_sop
    domain: CPP-01
    text: 'How frequently is CCTV footage reviewed proactively (not just post-incident)?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    score_drop_trigger: true
    module_tag: cctv_sop
    options: ['Daily', 'Weekly', 'Monthly', 'Only after incidents', 'Never']
    edges:
      - target: ent_cpp01_lighting
        condition: any

  - id: ent_cpp01_lighting
    domain: CPP-01
    text: 'Is the facility perimeter and all entry points adequately lit 24/7?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    options: ['Yes — all areas', 'Partial coverage', 'No — significant dark zones']
    edges:
      - target: ent_cpp06_shift_handover
        condition: any

  # ===== CPP-06: Personnel Security =====
  - id: ent_cpp06_shift_handover
    domain: CPP-06
    text: 'Is there a documented security handover checklist for guard shift changes?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    score_drop_trigger: true
    module_tag: loading_dock
    options: ['Yes — documented and followed', 'Informal handover', 'No checklist']
    edges:
      - target: ent_cpp06_contractor_access
        condition: any

  - id: ent_cpp06_contractor_access
    domain: CPP-06
    text: 'Do third-party contractors access restricted zones without an escort?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    score_drop_trigger: true
    module_tag: contractor_mgmt
    options: ['Yes — unescorted', 'Escorted only', 'No contractor access to restricted zones']
    edges:
      - target: ent_cpp06_bg_checks
        condition: any

  - id: ent_cpp06_bg_checks
    domain: CPP-06
    text: 'Are background checks conducted for all contractors and temporary staff?'
    question_type: single_choice
    cpp_domain_tag: CPP-06
    module_tag: contractor_mgmt
    options: ['Yes — mandatory', 'For some roles only', 'No']
    edges:
      - target: ent_cpp05_it_room
        condition: any

  # ===== CPP-05: Information Security =====
  - id: ent_cpp05_it_room
    domain: CPP-05
    text: 'Is the server room / IT room protected with keycard access and a visitor log?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    module_tag: it_physical
    options: ['Yes — keycard + log', 'Keycard only', 'No access control', 'No IT room on-site']
    edges:
      - target: ent_cpp05_network_segregation
        condition: any

  - id: ent_cpp05_network_segregation
    domain: CPP-05
    text: 'Are security systems (CCTV, access control) on a segregated network from corporate IT?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — fully segregated', 'Partially', 'No — same network']
    edges:
      - target: ent_cpp05_data_classification
        condition: 'Partially'
      - target: ent_cpp05_data_classification
        condition: 'No — same network'
      - target: ent_cpp03_emergency
        condition: any

  # --- CPP-05 Deep-Dive ---
  - id: ent_cpp05_data_classification
    domain: CPP-05
    text: 'Does the facility have a data classification policy that defines physical handling requirements for each tier?'
    question_type: single_choice
    cpp_domain_tag: CPP-05
    options: ['Yes — enforced policy', 'Policy exists but not enforced', 'No policy', 'Unsure']
    edges:
      - target: ent_cpp03_emergency
        condition: any

  # ===== CPP-03: Crisis Management =====
  - id: ent_cpp03_emergency
    domain: CPP-03
    text: 'When was the last evacuation drill conducted at this facility?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    module_tag: fire_safety
    options: ['Within last 6 months', '6-12 months ago', 'Over 12 months ago', 'Never']
    edges:
      - target: ent_cpp03_bcp
        condition: 'Over 12 months ago'
      - target: ent_cpp03_bcp
        condition: 'Never'
      - target: ent_cpp03_fire_officer
        condition: any

  # --- CPP-03 Deep-Dive ---
  - id: ent_cpp03_bcp
    domain: CPP-03
    text: 'Does the facility have a documented Business Continuity Plan (BCP) covering physical security scenarios?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options: ['Yes — tested annually', 'Yes — untested', 'No BCP', 'Under development']
    edges:
      - target: ent_cpp03_crisis_comms
        condition: any

  - id: ent_cpp03_crisis_comms
    domain: CPP-03
    text: 'Is there a defined crisis communication plan with pre-identified spokespersons and escalation paths?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    options:
      [
        'Yes — documented and trained',
        'Informally understood',
        'No',
        'Part of wider corporate plan',
      ]
    edges:
      - target: ent_cpp03_fire_officer
        condition: any

  - id: ent_cpp03_fire_officer
    domain: CPP-03
    text: 'Is there a designated fire safety officer for this facility?'
    question_type: single_choice
    cpp_domain_tag: CPP-03
    module_tag: fire_safety
    options: ['Yes — trained and certified', 'Yes — informal role', 'No']
    edges:
      - target: ent_inventory_controls
        condition: any

  # ===== Enterprise Module: Inventory Controls =====
  - id: ent_inventory_controls
    domain: CPP-01
    text: 'Are high-value inventory zones accessible to all warehouse staff?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    score_drop_trigger: true
    module_tag: inventory_controls
    options: ['Yes — all staff', 'Restricted to authorised personnel', 'Two-person rule enforced']
    edges:
      - target: ent_loading_dock
        condition: any

  - id: ent_loading_dock
    domain: CPP-01
    text: 'Is there a two-person verification rule for high-value shipments at the loading dock?'
    question_type: single_choice
    cpp_domain_tag: CPP-01
    score_drop_trigger: true
    module_tag: loading_dock
    options: ['Yes', 'No', 'Not applicable']
    edges:
      - target: ent_cpp02_risk_owner
        condition: any

  # ===== CPP-02: Business Principles =====
  - id: ent_cpp02_risk_owner
    domain: CPP-02
    text: 'Is there a named individual accountable for physical security risk at this facility?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options: ['Yes — with defined authority', 'Informal role', 'No']
    edges:
      - target: ent_cpp02_budget_allocation
        condition: 'Informal role'
      - target: ent_cpp02_budget_allocation
        condition: 'No'
      - target: ent_cpp02_risk_review_freq
        condition: any

  # --- CPP-02 Deep-Dive ---
  - id: ent_cpp02_budget_allocation
    domain: CPP-02
    text: 'Is there a dedicated annual budget for physical security improvements at this facility?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options:
      [
        'Yes — defined budget line',
        'Ad hoc spending only',
        'No budget',
        'Part of general facilities',
      ]
    edges:
      - target: ent_cpp02_risk_review_freq
        condition: any

  - id: ent_cpp02_risk_review_freq
    domain: CPP-02
    text: 'How often does management formally review security risks and mitigation progress?'
    question_type: single_choice
    cpp_domain_tag: CPP-02
    options: ['Monthly', 'Quarterly', 'Annually', 'Never / ad hoc']
    edges:
      - target: ent_cpp07_review_cycle
        condition: any

  # ===== CPP-07: Security Management =====
  - id: ent_cpp07_review_cycle
    domain: CPP-07
    text: 'Is there a recurring (at least annual) security review cycle for this facility?'
    question_type: single_choice
    cpp_domain_tag: CPP-07
    options: ['Yes — quarterly or more', 'Yes — annually', 'No formal cycle']
    edges:
      - target: ent_cpp04_incident_log
        condition: any

  # ===== CPP-04: Investigations =====
  - id: ent_cpp04_incident_log
    domain: CPP-04
    text: 'Are security incidents formally logged with date, type, response, and corrective actions?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes — digital system', 'Yes — paper log', 'Informal only', 'Not logged']
    edges:
      - target: ent_cpp04_root_cause
        condition: 'Informal only'
      - target: ent_cpp04_root_cause
        condition: 'Not logged'
      - target: ent_cpp04_trend_analysis
        condition: any

  # --- CPP-04 Deep-Dive ---
  - id: ent_cpp04_root_cause
    domain: CPP-04
    text: 'When incidents occur, is a root cause analysis conducted and corrective actions tracked to closure?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options:
      ['Yes — formal process', 'Sometimes — depends on severity', 'No — incidents not investigated']
    edges:
      - target: ent_cpp04_trend_analysis
        condition: any

  - id: ent_cpp04_trend_analysis
    domain: CPP-04
    text: 'Does management receive periodic reports on security incident trends and repeat patterns?'
    question_type: single_choice
    cpp_domain_tag: CPP-04
    options: ['Yes — monthly dashboard', 'Yes — quarterly report', 'No trend analysis', 'Unsure']
    edges:
      - target: ent_terminal
        condition: any

  # ===== TERMINAL =====
  - id: ent_terminal
    domain: CPP-07
    text: 'Thank you. Your facility security assessment is complete. We are generating your report.'
    question_type: terminal
    cpp_domain_tag: CPP-07
    is_terminal: true
    edges: []
