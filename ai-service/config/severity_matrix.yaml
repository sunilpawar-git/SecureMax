# Severity Calibration Matrix — SSOT for question-to-severity mapping.
# Each entry maps a graph node ID to severity_override and risk_impact when
# a negative answer pattern is detected. Questions not listed here fall
# through to keyword-based classification in answer_keywords.py.
#
# Format:
#   DOMAIN:
#     node_id:
#       negative_patterns: [list of answer substrings that indicate risk]
#       severity_override: critical | high | medium | low
#       risk_impact: human-readable business impact statement

CPP-01:
  hni_cpp01_perimeter:
    negative_patterns: ["no", "no fence", "no boundary", "no perimeter"]
    severity_override: critical
    risk_impact: "No defined perimeter boundary — intruders face zero physical deterrent at the property edge"
  hni_cpp01_cctv:
    negative_patterns: ["no", "not installed", "no cameras", "no cctv"]
    severity_override: critical
    risk_impact: "No visual surveillance — intruders can operate undetected across the entire property"
  hni_cpp01_gate_code:
    negative_patterns: ["no", "shared code", "never changed", "same code"]
    severity_override: high
    risk_impact: "Access code compromise risk — shared or static codes allow unauthorised entry"
  hni_cpp01_lighting:
    negative_patterns: ["not lit", "no lighting", "no", "dark zones"]
    severity_override: high
    risk_impact: "Inadequate lighting creates concealment opportunities for hostile surveillance or entry"
  hni_travel_module_entry:
    negative_patterns: ["yes — frequently", "yes — occasionally"]
    severity_override: medium
    risk_impact: "Extended absences increase vulnerability to targeted surveillance and break-in timing"
  hni_visitor_delivery:
    negative_patterns: ["no", "no screening", "unrestricted", "open access"]
    severity_override: high
    risk_impact: "Uncontrolled visitor and delivery access bypasses all perimeter security investments"
  ent_cpp01_perimeter:
    negative_patterns: ["Unfenced or open boundary", "No formal perimeter controls"]
    severity_override: critical
    risk_impact: "Facility perimeter unsecured — unrestricted physical access to building exterior"
  ent_cpp01_cctv_sop:
    negative_patterns: ["no", "no sop", "not documented", "ad hoc"]
    severity_override: high
    risk_impact: "CCTV system operates without standard procedures — evidence may be lost or inadmissible"
  ent_cpp01_lighting:
    negative_patterns: ["no", "partial", "not lit", "dark areas"]
    severity_override: high
    risk_impact: "Inadequate external lighting enables undetected approach to facility entry points"
  ent_inventory_controls:
    negative_patterns: ["no", "no controls", "not tracked", "manual only"]
    severity_override: medium
    risk_impact: "Asset inventory not controlled — theft or loss may go undetected for extended periods"
  hni_cpp01_access_control:
    negative_patterns: ["traditional lock only", "no formal access control", "no", "basic lock"]
    severity_override: critical
    risk_impact: "No modern access control — property relies solely on physical keys, easily copied or compromised"
  hni_cpp01_visitor_screening:
    negative_patterns: ["no — direct entry", "open compound", "no screening"]
    severity_override: high
    risk_impact: "No visitor identity verification — hostile actors can enter property unchallenged"
  hni_cpp01_contractor_policy:
    negative_patterns: ["never — work unsupervised", "never", "unsupervised"]
    severity_override: high
    risk_impact: "Contractors operate unsupervised inside property — theft, reconnaissance, or sabotage risk"
  hni_cpp01_after_hours_protocol:
    negative_patterns: ["no — same as daytime", "informal arrangement", "no"]
    severity_override: medium
    risk_impact: "No after-hours access protocol — property vulnerable during low-awareness periods"
  ent_facility_warehouse_yard:
    negative_patterns: ["no — open yard", "open yard", "no barrier"]
    severity_override: high
    risk_impact: "Open dispatch yard allows uncontrolled vehicle and personnel access to loading areas"
  ent_facility_dock_cctv:
    negative_patterns: ["no cctv on dock", "partial — some gaps", "unsure"]
    severity_override: high
    risk_impact: "Loading dock lacks adequate surveillance — theft or tampering may go undetected"
  ent_loading_dock:
    negative_patterns: ["no", "unsupervised", "open access", "no controls"]
    severity_override: high
    risk_impact: "Loading dock without access controls is a primary vector for unauthorised material or personnel entry"

