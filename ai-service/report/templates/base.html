<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      @page { margin: 20mm 15mm; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11pt;
        line-height: 1.6;
        color: #1a1a2e;
        background: #fff;
      }
      .page-break { page-break-after: always; }

      /* Header */
      .report-header {
        background: {{ branding.primary_color }};
        color: #fff;
        padding: 30px 40px;
        margin: -20mm -15mm 20px -15mm;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .report-header h1 { font-size: 22pt; font-weight: 700; }
      .report-header .meta { font-size: 9pt; opacity: 0.85; text-align: right; }

      /* Sections */
      .section { margin-bottom: 28px; }
      .section-title {
        font-size: 14pt;
        font-weight: 700;
        color: {{ branding.primary_color }};
        border-bottom: 2px solid {{ branding.accent_color }};
        padding-bottom: 6px;
        margin-bottom: 14px;
      }

      /* Findings table */
      table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
      th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
      th { background: #f3f4f6; font-weight: 600; font-size: 9pt; text-transform: uppercase; }

      /* Severity badges */
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 4px;
        color: #fff;
        font-size: 9pt;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-critical { background: {{ severity_colors.critical }}; }
      .badge-high { background: {{ severity_colors.high }}; }
      .badge-medium { background: {{ severity_colors.medium }}; color: #1a1a2e; }
      .badge-low { background: {{ severity_colors.low }}; }

      /* Urgency meter */
      .urgency-bar {
        height: 12px;
        border-radius: 6px;
        background: #e5e7eb;
        overflow: hidden;
        margin: 8px 0;
      }
      .urgency-fill { height: 100%; border-radius: 6px; }

      /* Footer */
      .report-footer {
        font-size: 8pt;
        color: #6b7280;
        border-top: 1px solid #e5e7eb;
        padding-top: 10px;
        margin-top: 30px;
        text-align: center;
      }

      .cpp-citation {
        font-size: 9pt;
        color: #6b7280;
        font-style: italic;
        margin-top: 4px;
      }

      .summary-text { margin-bottom: 16px; line-height: 1.7; }
      .stat-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
      .stat-box {
        flex: 1;
        min-width: 120px;
        padding: 14px;
        background: #f9fafb;
        border-radius: 8px;
        text-align: center;
      }
      .stat-value { font-size: 20pt; font-weight: 700; color: {{ branding.primary_color }}; }
      .stat-label { font-size: 8pt; color: #6b7280; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="report-header">
      <div>
        <h1>{{ branding.company_name }}</h1>
        <div style="font-size: 10pt; margin-top: 4px">Security Audit Report</div>
      </div>
      <div class="meta">
        <div>Session: {{ report.session_id[:12] }}...</div>
        <div>Track: {{ report.track | upper }}</div>
        <div>{{ generated_at }}</div>
      </div>
    </div>

    {% block content %}{% endblock %}

    <div class="report-footer">
      {{ confidentiality_notice }}<br />
      &copy; {{ year }} {{ branding.company_name }}. All rights reserved.
    </div>
  </body>
</html>
