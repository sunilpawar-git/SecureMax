<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      @page { margin: 20mm 15mm; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11pt;
        line-height: 1.6;
        color: {{ colors.text_primary }};
        background: #fff;
      }
      .page-break { page-break-after: always; }

      /* Cover Page */
      .cover-page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
        text-align: center;
      }
      .cover-logo { font-size: 28pt; font-weight: 800; color: {{ branding.primary_color }}; }
      .cover-title { font-size: 20pt; font-weight: 600; color: {{ colors.text_primary }}; margin-top: 40px; }
      .cover-subtitle { font-size: 12pt; color: {{ colors.text_secondary }}; margin-top: 12px; }
      .cover-meta { font-size: 9pt; color: {{ colors.text_muted }}; margin-top: 60px; line-height: 2; }
      .cover-confidential {
        font-size: 8pt;
        color: {{ colors.text_muted }};
        border-top: 1px solid {{ colors.border }};
        padding-top: 16px;
        margin-top: 60px;
        max-width: 400px;
      }

      /* Header (non-cover pages) */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid {{ branding.accent_color }};
        padding-bottom: 8px;
        margin-bottom: 24px;
      }
      .page-header-brand { font-size: 12pt; font-weight: 700; color: {{ branding.primary_color }}; }
      .page-header-meta { font-size: 8pt; color: {{ colors.text_muted }}; text-align: right; }

      /* Sections */
      .section { margin-bottom: 28px; }
      .section-title {
        font-size: 14pt;
        font-weight: 700;
        color: {{ branding.primary_color }};
        border-bottom: 2px solid {{ branding.accent_color }};
        padding-bottom: 6px;
        margin-bottom: 14px;
      }

      /* Stat boxes */
      .stat-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
      .stat-box {
        flex: 1;
        min-width: 120px;
        padding: 14px;
        background: {{ colors.bg_subtle }};
        border-radius: 8px;
        text-align: center;
      }
      .stat-value { font-size: 20pt; font-weight: 700; color: {{ branding.primary_color }}; }
      .stat-label { font-size: 8pt; color: {{ colors.text_muted }}; text-transform: uppercase; }

      /* Urgency meter */
      .urgency-bar { height: 12px; border-radius: 6px; background: {{ colors.border }}; overflow: hidden; margin: 8px 0; }
      .urgency-fill { height: 100%; border-radius: 6px; }

      /* Finding cards */
      .finding-card {
        margin-bottom: 18px;
        padding: 14px;
        border-radius: 0 8px 8px 0;
        background: {{ colors.bg_subtle }};
      }
      .finding-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .finding-domain { font-weight: 700; font-size: 10pt; }
      .finding-field { font-size: 10pt; margin-bottom: 4px; }
      .finding-field-label { font-weight: 600; }
      .finding-risk-impact {
        font-size: 9pt;
        color: {{ severity_colors.critical }};
        font-style: italic;
        margin-top: 6px;
        padding: 6px 10px;
        background: #FEF2F2;
        border-radius: 4px;
      }
      .finding-cpp-citation {
        font-size: 9pt;
        color: {{ colors.text_muted }};
        font-style: italic;
        margin-top: 4px;
      }
      .finding-physical-flag {
        font-size: 9pt;
        color: {{ severity_colors.critical }};
        margin-top: 4px;
      }

      /* Severity badges */
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 4px;
        color: #fff;
        font-size: 9pt;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-critical { background: {{ severity_colors.critical }}; }
      .badge-high { background: {{ severity_colors.high }}; }
      .badge-medium { background: {{ severity_colors.medium }}; color: {{ colors.text_primary }}; }
      .badge-low { background: {{ severity_colors.low }}; }

      /* Tables */
      table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
      th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid {{ colors.border }}; }
      th { background: {{ colors.bg_subtle }}; font-weight: 600; font-size: 9pt; text-transform: uppercase; }

      /* Radar chart */
      .radar-container { text-align: center; margin: 16px 0; }

      /* Summary text */
      .summary-text { margin-bottom: 16px; line-height: 1.7; }

      /* Footer */
      .report-footer {
        font-size: 8pt;
        color: {{ colors.text_muted }};
        border-top: 1px solid {{ colors.border }};
        padding-top: 10px;
        margin-top: 30px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    {% block cover %}{% endblock %}

    <div class="page-header">
      <div class="page-header-brand">{{ branding.company_name }}</div>
      <div class="page-header-meta">
        {{ report.track | upper }} Security Audit<br />
        {{ generated_at }}
      </div>
    </div>

    {% block content %}{% endblock %}

    <div class="report-footer">
      {{ confidentiality_notice }}<br />
      &copy; {{ year }} {{ branding.company_name }}. All rights reserved.
    </div>
  </body>
</html>
