# SSOT for scraper data sources — edit here, not in Python code.
# Tiers: newsapi (tier 1), rss (tier 2), playwright (tier 3).

newsapi:
  - name: 'News API — Physical Security'
    type: newsapi
    query: 'physical security'
    api_key_env: NEWS_API_KEY
    page_size: 20
  - name: 'News API — India Physical Security'
    type: newsapi
    query: 'physical security India'
    api_key_env: NEWS_API_KEY
    page_size: 20
  - name: 'News API — India Security Breach'
    type: newsapi
    query: 'security breach India theft burglary'
    api_key_env: NEWS_API_KEY
    page_size: 20
  - name: 'News API — India CCTV Surveillance'
    type: newsapi
    query: 'CCTV surveillance India'
    api_key_env: NEWS_API_KEY
    page_size: 15
  - name: 'News API — India Fire Building Disaster'
    type: newsapi
    query: '"fire" OR "building collapse" OR "stampede" India deaths'
    api_key_env: NEWS_API_KEY
    page_size: 20
  - name: 'News API — Drone Attack Airport Security'
    type: newsapi
    query: 'drone attack OR airport security OR counter-drone'
    api_key_env: NEWS_API_KEY
    page_size: 15
  - name: 'News API — Executive Kidnapping VIP Threat'
    type: newsapi
    query: 'kidnapping ransom executive protection VIP security'
    api_key_env: NEWS_API_KEY
    page_size: 15

rss:
  # Global physical security publications
  - name: 'Security Magazine — Physical Security'
    type: rss
    url: 'https://www.securitymagazine.com/rss/topic/2228-physical-security'
  - name: 'Security Magazine — Newswire'
    type: rss
    url: 'https://www.securitymagazine.com/rss/topic/2189-security-newswire'
  - name: 'Help Net Security'
    type: rss
    url: 'https://www.helpnetsecurity.com/feed/'
  - name: 'CSO Online'
    type: rss
    url: 'https://www.csoonline.com/feed/'
  - name: 'Dark Reading'
    type: rss
    url: 'https://www.darkreading.com/rss.xml'

  # Global defense & emerging threats (drones, geopolitical)
  - name: 'The Defense Post — Drones'
    type: rss
    url: 'https://www.thedefensepost.com/category/drones/feed'

  # Indian news — security, crime, fire, disasters, infrastructure
  - name: 'NDTV — Top Stories'
    type: rss
    url: 'https://feeds.feedburner.com/ndtvnews-top-stories'
  - name: 'The Hindu — National'
    type: rss
    url: 'https://www.thehindu.com/news/national/feeder/default.rss'
  - name: 'Economic Times — Industry'
    type: rss
    url: 'https://economictimes.indiatimes.com/industry/rssfeeds/13352306.cms'
  - name: 'Hindustan Times — India News'
    type: rss
    url: 'https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml'
  - name: 'Times of India — City'
    type: rss
    url: 'https://timesofindia.indiatimes.com/rssfeeds/913168846.cms'
  - name: 'Indian Express — India'
    type: rss
    url: 'https://indianexpress.com/section/india/feed/'
  - name: 'Business Standard — Companies'
    type: rss
    url: 'https://www.business-standard.com/rss/companies-101.rss'
  - name: 'India Today — India'
    type: rss
    url: 'https://www.indiatoday.in/rss/1206578'
  - name: 'News18 — India'
    type: rss
    url: 'https://www.news18.com/rss/india.xml'
  - name: 'Livemint — News'
    type: rss
    url: 'https://www.livemint.com/rss/news'

  # Indian security industry & government
  - name: 'CISF Official (Gov)'
    type: rss
    url: 'https://cisf.gov.in/rss-feed/'
  - name: 'SecurityLink India'
    type: rss
    url: 'https://www.securitylinkindia.com/feed/'
  - name: 'Fire & Safety India'
    type: rss
    url: 'https://www.fireandsafetyindia.com/feed/'

playwright:
  # Global security blogs
  - name: 'The Security Company Blog'
    type: playwright
    url: 'https://thesecuritycompany.com/the-latest/'
    selector_article: 'article'
    selector_title: 'h2'
    selector_link: 'a'
    max_articles: 10
  - name: 'Security Journal Americas'
    type: playwright
    url: 'https://www.securityjournalamericas.com/news/'
    selector_article: 'article.post'
    selector_title: '.entry-title'
    selector_link: '.entry-title a'
    max_articles: 10

  # Indian security & industry portals
  - name: 'Security Today India'
    type: playwright
    url: 'https://www.securitytoday.in/news/'
    selector_article: 'article'
    selector_title: 'h2'
    selector_link: 'a'
    max_articles: 10
  - name: 'IFSEC Global — India'
    type: playwright
    url: 'https://www.ifsecglobal.com/asia/'
    selector_article: 'article'
    selector_title: 'h3'
    selector_link: 'a'
    max_articles: 10
  - name: 'CAPSI — Private Security Industry India'
    type: playwright
    url: 'https://www.capsi.in/'
    selector_article: '.news-item, article, .post'
    selector_title: 'h2, h3, .title'
    selector_link: 'a'
    max_articles: 10
