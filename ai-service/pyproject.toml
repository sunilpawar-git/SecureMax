[project]
name = "raivan-ai-service"
version = "0.1.0"
description = "Raivan Global AI Service — Gemini-powered security audit engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: marks tests that hit real external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "N817", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"session_repository.py" = ["S608"]
"report/enrichment.py" = ["S608"]
