<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Raivan Global</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #1e293b;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        text-align: center;
        space-y: 16px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        background: #d1fae5;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: #0f172a;
      }
      p {
        font-size: 0.875rem;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      button {
        background: #047857;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #065f46;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg
          width="32"
          height="32"
          fill="none"
          viewBox="0 0 24 24"
          stroke="#047857"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
          />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        Raivan Global requires an internet connection to run the security assessment and generate
        your report. Please check your connection and try again.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
